# yaml-language-server: $schema=
version: 2

sources:
  - name: lake
    description: >
      Parquet ecrits par le job Spark Structured Streaming, dans MinIO.
      Partitionnes par site_id et par date d'evenement.
    schema: main
    tables:
      - name: telemetry
        description: Mesures ayant passe les trois portes qualite.
        meta:
          external_location: >-
            read_parquet('s3://{{ env_var('MINIO_BUCKET', 'irrigation') }}/telemetry/**/*.parquet',
                         hive_partitioning = true)
      - name: quarantine
        description: Mesures rejetees, avec leur motif et le payload d'origine.
        meta:
          external_location: >-
            read_parquet('s3://{{ env_var('MINIO_BUCKET', 'irrigation') }}/quarantine/**/*.parquet',
                         hive_partitioning = true)
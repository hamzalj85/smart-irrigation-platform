[project]
name = "smart-irrigation-platform"
version = "1.0.0"
description = "IoT to lakehouse pipeline: MQTT, Kafka, Spark, MinIO, dbt, Airflow"
requires-python = ">=3.11"

# ---------------------------------------------------------------------------
# Ruff: the rule set is declared explicitly, not inherited from the defaults.
# Defaults change between versions; a CI pipeline has to be deterministic.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".venv",
    "data",
    "transforms/dbt/target",
    "transforms/dbt/dbt_packages",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear: common traps
    "C4",   # comprehensions
    "SIM",  # simplifications
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# These files manipulate sys.path before importing: that is intentional.
"ml/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The modules under test are not an installed package: make them importable.
pythonpath = ["ml", "ingestion/simulator", "ingestion/bridge", "streaming/spark"]
addopts = "-q --strict-markers"
markers = [
    "spark: requires PySpark and a JVM (slower)",
    "integration: requires the full Docker stack, excluded by default",
]

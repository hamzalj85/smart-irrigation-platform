# yaml-language-server: $schema=
version: 2

sources:
  - name: lake
    description: >
      Parquet files written to MinIO by the Spark Structured Streaming job,
      partitioned by site_id and by event date.
    schema: main
    tables:
      - name: telemetry
        description: Readings that passed the three quality gates.
        meta:
          external_location: >-
            read_parquet('s3://{{ env_var('MINIO_BUCKET', 'irrigation') }}/telemetry/**/*.parquet',
                         hive_partitioning = true)
      - name: quarantine
        description: Rejected readings, with their reason and the original payload.
        meta:
          external_location: >-
            read_parquet('s3://{{ env_var('MINIO_BUCKET', 'irrigation') }}/quarantine/**/*.parquet',
                         hive_partitioning = true)

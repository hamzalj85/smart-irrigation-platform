# Datasource provisioned at startup: no clicking in the interface.
# The uid is pinned ("prometheus") because the dashboards reference it.
# Without a stable uid, an imported dashboard would point at a datasource that
# does not exist.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s        # must match Prometheus scrape_interval
      httpMethod: POST

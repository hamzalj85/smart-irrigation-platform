version: 2

models:
  - name: stg_telemetry
    description: Validated telemetry, renamed and typed. One row per reading.
    columns:
      - name: device_id
        description: ESP32 identifier, also the Kafka partition key.
        tests: [not_null]
      - name: measured_at
        description: Event time (UTC), stamped by the sensor itself.
        tests: [not_null]
      - name: soil_moisture_pct
        description: Volumetric soil moisture, after calibration.
        tests:
          - not_null
          - accepted_range: {min_value: 0, max_value: 100}
      - name: air_temp_c
        description: Air temperature, after calibration.
        tests:
          - accepted_range: {min_value: -40, max_value: 80}

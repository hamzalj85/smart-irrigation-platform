# Loads every JSON file dropped into /var/lib/grafana/dashboards.
# The dashboards therefore live in the Git repository, not in Grafana's internal
# database: a fresh clone gets exactly the same screens.
apiVersion: 1

providers:
  - name: irrigation
    orgId: 1
    folder: Irrigation
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false      # the UI cannot overwrite the file
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

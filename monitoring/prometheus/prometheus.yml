# Prometheus works by "pull": it goes and fetches the metrics from each target,
# not the other way round. The practical consequence: a service that dies
# becomes a visible "down" target, whereas in "push" mode it would simply
# vanish from the dashboard without anyone noticing.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: smart-irrigation

scrape_configs:
  - job_name: bridge
    static_configs:
      - targets: ["bridge:8000"]
        labels:
          component: ingestion

  - job_name: spark
    static_configs:
      - targets: ["spark-streaming:8000"]
        labels:
          component: streaming

  # Prometheus scrapes itself: if this job disappears from the charts, it is
  # the monitoring that went down, not the pipeline.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          component: monitoring

# Configuration partagee par les cinq conteneurs Airflow.
# Une ancre YAML (&) definie ici, referencee plus bas par <<: *airflow-common.
x-airflow-common: &airflow-common
  build: ./orchestration/airflow
  environment:
    # --- Airflow ---------------------------------------------------------
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/airflow
    AIRFLOW__API__BASE_URL: http://localhost:8082
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Developpement uniquement : desactive l'authentification de l'interface.
    # En production on brancherait un vrai gestionnaire d'identites.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    # --- Acces aux services de la plateforme -----------------------------
    MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/
    MONGO_DB: irrigation
    MONGO_COLLECTION: device_state
    MQTT_HOST: mosquitto
    MQTT_PORT: "1883"
    MOSQUITTO_BRIDGE_USER: ${MOSQUITTO_BRIDGE_USER}
    MOSQUITTO_BRIDGE_PASSWORD: ${MOSQUITTO_BRIDGE_PASSWORD}
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    MINIO_BUCKET: ${MINIO_BUCKET}
    S3_ENDPOINT_HOST: minio:9000
  volumes:
    - ./orchestration/airflow/dags:/opt/airflow/dags
    - ./transforms/dbt:/opt/airflow/dbt
    - ./ml:/opt/airflow/ml
    - airflow_logs:/opt/airflow/logs

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: irrigation-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
  kafka:
    image: apache/kafka:3.9.0
    container_name: irrigation-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: irrigation-kraft-cluster
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: irrigation-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command: 
        - |
          set -e
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic irrigation.telemetry --partitions 3 --replication-factor 1 --config retention.ms=604800000
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic irrigation.telemetry.dlq --partitions 1 --replication-factor 1 --config retention.ms=2592000000
          echo "--- topics ---"
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: irrigation-kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: irrigation
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

  bridge:
    build: ./ingestion/bridge
    container_name: irrigation-bridge
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MOSQUITTO_BRIDGE_USER: ${MOSQUITTO_BRIDGE_USER}
      MOSQUITTO_BRIDGE_PASSWORD: ${MOSQUITTO_BRIDGE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TELEMETRY_TOPIC: irrigation.telemetry
      KAFKA_DLQ_TOPIC: irrigation.telemetry.dlq

  spark-streaming:
    build: ./streaming/spark
    container_name: irrigation-spark
    ports:
      - "4040:4040"
    restart: on-failure:3
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TELEMETRY_TOPIC: irrigation.telemetry
      CHECKPOINT_DIR: /checkpoints
      DATA_DIR: s3a://${MINIO_BUCKET}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STARTING_OFFSETS: latest
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_LOG_LEVEL: WARN
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/
      MONGO_DB: irrigation
      MONGO_COLLECTION: device_state
    volumes:
      - spark_checkpoints:/checkpoints

  minio:
    image: minio/minio:latest      # TODO Phase 11 : épingler (voir plus bas)
    container_name: irrigation-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"     # API S3
      - "9001:9001"     # console web
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: irrigation-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/"$$MINIO_BUCKET"
        mc version enable local/"$$MINIO_BUCKET" || true
        echo "--- buckets ---"
        mc ls local

  mongodb:
    image: mongo:7
    container_name: irrigation-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: irrigation
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  mongo-express:
    image: mongo-express:1.0.2
    container_name: irrigation-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongodb:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Orchestration : Airflow 3 (LocalExecutor, metadonnees dans Postgres)
  # ---------------------------------------------------------------------------
  airflow-postgres:
    image: postgres:16
    container_name: irrigation-airflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  airflow-init:
    <<: *airflow-common
    container_name: irrigation-airflow-init
    restart: "no"
    depends_on:
      airflow-postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        airflow db migrate
        echo "--- airflow pret ---"
        airflow version

  airflow-apiserver:
    <<: *airflow-common
    container_name: irrigation-airflow-api
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: api-server
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s

  airflow-scheduler:
    <<: *airflow-common
    container_name: irrigation-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

  airflow-dag-processor:
    <<: *airflow-common
    container_name: irrigation-airflow-dag-processor
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: dag-processor

  airflow-triggerer:
    <<: *airflow-common
    container_name: irrigation-airflow-triggerer
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: triggerer

volumes:
  mosquitto_data:
  mosquitto_log:
  kafka_data:
  mongo_data:
  spark_checkpoints:
  minio_data:
  airflow_db:
  airflow_logs:
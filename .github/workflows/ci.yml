name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A run already in flight on the same branch is cancelled when we push again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff==0.16.2
      # We run ruff's *linter*, not its *formatter*: some alignments (the schema
      # columns, the constant tables) are deliberate and an automatic formatter
      # would destroy them.
      - name: ruff check
        run: ruff check --output-format=github .

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # PySpark needs a JVM; GitHub runners provide one.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        # requirements-dev.txt is enough: the logic under test does not depend
        # on the Kafka or MQTT clients. Only PySpark is added, for the quality
        # gates.
        run: |
          pip install -r requirements-dev.txt
          pip install "pyspark==3.5.3"
      - name: pytest
        # The `integration` marker requires the Docker stack: excluded here.
        run: pytest -m "not integration" --junitxml=junit.xml
        env:
          SPARK_LOCAL_IP: 127.0.0.1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: junit.xml

  dbt:
    name: dbt parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install "dbt-core==1.9.10" "dbt-duckdb==1.9.6"
      - name: dbt parse
        # `parse` compiles the models and resolves the dependency graph without
        # connecting to MinIO: a Jinja error or a broken ref is caught here,
        # with no infrastructure at all.
        working-directory: transforms/dbt
        run: dbt parse
        env:
          DBT_PROFILES_DIR: .
          MINIO_ROOT_USER: ci
          MINIO_ROOT_PASSWORD: ci
          MINIO_BUCKET: irrigation
          S3_ENDPOINT_HOST: localhost:9000

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose file
        # Catches a broken YAML anchor or an undefined variable before it
        # breaks the startup of someone who just cloned the repository.
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "docker-compose.yml is valid"
